services:
  backend:
    build: ./backend
    container_name: teamup-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      # SQLite 数据库持久化：容器重建后数据仍保留
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: teamup-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
